version: '3.9'

services:
  db:
    image: postgres:16
    container_name: swen-db
    restart: always
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db.sql:/docker-entrypoint-initdb.d/db.sql

  # Optional: Grafische Oberfläche für die DB unter http://localhost:8081
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  pgdata: